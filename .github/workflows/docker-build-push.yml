name: Build and Push Docker Image

on:
  push:
    branches:
      - '**'   # Triggers on push to ANY branch

jobs:
  build-and-push:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (enables advanced build features & caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to DockerHub using secrets
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Extract metadata for tagging (branch name + commit SHA)
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/nike-tiger-landing
          tags: |
            # Tag with sanitized branch name (e.g. main, feature-xyz)
            type=ref,event=branch
            # Tag with short commit SHA (e.g. sha-a1b2c3d)
            type=sha,prefix=sha-,format=short

      # Step 5: Build the Docker image and push to DockerHub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers using GitHub Actions cache (avoids DockerHub token scope issues)
          cache-from: type=gha
          cache-to: type=gha,mode=max
